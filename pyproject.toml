[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-intelligence-layer"
version = "0.1.0"
description = "A small, shared project-context and engineering-memory layer for AI coding harnesses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2",
]

[project.scripts]
hil = "harness_intelligence.cli:main"
hil-mcp = "harness_intelligence.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

