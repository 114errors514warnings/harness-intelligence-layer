name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip "mcp>=1.0,<2"

      - name: Report detected tooling
        run: |
          python --version
          rg --version || echo "ripgrep missing - the os.walk fallback runs, and the cross-path check will skip"

      - name: Run unit tests
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Run the Phase 0 task set against the HIL arm
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python benchmarks/measure.py --label ci

      - name: Verify phase invariants and regression gates
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python benchmarks/verify.py

      - name: Upload measurement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-measurement-${{ matrix.python-version }}
          path: .hil/results/hil_ci_*.json
          if-no-files-found: warn
